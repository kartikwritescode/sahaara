name: sahaara
description: "Sahaara — AI Safety Layer for Elderly Care"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management & Routing
  get: ^4.7.3

  # Backend & Auth
  supabase_flutter: ^2.17.2

  # Location & Maps
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Media
  cloudinary_public: ^0.23.1
  image_picker: ^1.2.3

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Legacy UI & Tasks dependencies
  google_fonts: ^8.2.1
  date_picker_timeline: ^1.2.7
  day_night_time_picker: ^1.3.1
  font_awesome_flutter: ^11.0.0
  country_picker: ^2.0.28
  country_code_picker: ^3.4.1

  # Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.20.3
  uuid: ^4.5.1
  logger: ^2.5.0
  connectivity_plus: ^7.3.1
  audioplayers: ^6.7.1
  fl_chart: ^1.2.0
  supabase: ^2.16.1
  http: ^1.6.0
  file_picker: ^12.0.0
  google_sign_in: ^7.2.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  flutter_datetime_picker_plus: ^2.4.0
  flutter_datetime_picker_bdaya: ^3.0.2
  glassmorphism: ^3.0.0
  lottie: ^3.3.3
  flutter_floating_bottom_bar: ^2.1.0
  location: ^10.0.2
  flutter_map: ^8.3.1
  sign_in_with_apple: ^7.0.1
  foundation: ^0.0.5
  flutter_web_auth_2: ^5.1.0
  app_links: ^7.0.0
  syncfusion_flutter_gauges: ^34.2.4
  battery_plus: ^7.1.1
  pedometer: ^4.2.0
  image_cropper: ^12.2.1
  package_info_plus: ^10.2.1
  latlong2: ^0.10.1
  vibration: ^3.1.8
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  health: ^13.3.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
