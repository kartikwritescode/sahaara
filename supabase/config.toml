# Supabase local development and branching configuration

project_id = "sahaara-elderguard"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[functions.risk-engine]
verify_jwt = false

[functions.escalation-engine]
verify_jwt = false

[functions.checkin-scheduler]
verify_jwt = false

[functions.ai-summary]
verify_jwt = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
